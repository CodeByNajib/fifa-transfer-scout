services:
  fastapi:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env

  streamlit:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - fastapi
    env_file: .env