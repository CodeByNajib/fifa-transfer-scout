services:
  fastapi:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - sqlite_data:/app/data

  streamlit:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - fastapi
    env_file: .env

volumes:
  sqlite_data: # Docker håndterer det automatisk - manuel setup ikke nødvendigt. 
